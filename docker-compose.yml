
services:
  postgres:
    image: postgres:16-alpine
    container_name: kumpul-postgres
    environment:
      POSTGRES_USER: kumpul_user
      POSTGRES_PASSWORD: kumpul_password
      POSTGRES_DB: kumpul_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./packages/database/src/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kumpul_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kumpul-network

  redis:
    image: redis:7-alpine
    container_name: kumpul-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kumpul-network

  minio:
    image: quay.io/minio/minio:latest
    container_name: kumpul-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kumpul-network

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  kumpul-network:
    driver: bridge
